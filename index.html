<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Management Peserta - Tech Fest 2026</title>
    
    <link rel="stylesheet" href="css/body.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/header.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <header class="navbar">
        <div class="nav-content">
            <h1>Tech Fest 2026</h1>
            <span class="badge">Dashboard Admin</span>
        </div>
    </header>

    <main class="container">
        
        <!--Navbar-->
        <div class="nav-tabs">
            <button class="nav-btn active-tab" id="btnPageForm">Formulir Pendaftaran</button>
            <button class="nav-btn" id="btnPageTable">Daftar Peserta</button>
        </div>

        <!--Hal 1-->
        <section id="pageForm" class="pixel-card form-card halaman aktif">
            <div class="card-header">
                <h2 id="formTitle">Formulir Pendaftaran</h2>
                <button type="button" id="btnCancelEdit" class="btn-cancel" style="display: none;">Batal Edit</button>
            </div>
            
            <div id="statusAlert" class="alert-box"></div>

            <form id="formPendaftaran" novalidate>
                <input type="hidden" id="editId" value="">

                <div class="field-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap">
                    <span class="error-msg" id="err-nama"></span>
                </div>

                <div class="field-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" name="email" placeholder="nama@email.com">
                    <span class="error-msg" id="err-email"></span>
                </div>

                <div class="field-row">
                    <div class="field-group">
                        <label for="kelas">Kelas</label>
                        <select id="kelas" name="kelas">
                            <option value="">Pilih Kelas</option>
                            <option value="X">Kelas X</option>
                            <option value="XI">Kelas XI</option>
                            <option value="XII">Kelas XII</option>
                        </select>
                        <span class="error-msg" id="err-kelas"></span>
                    </div>

                    <div class="field-group">
                        <label for="jurusan">Jurusan</label>
                        <select id="jurusan" name="jurusan">
                            <option value="">Pilih Jurusan</option>
                            <option value="RPL">RPL</option>
                            <option value="TKJ">TKJ</option>
                            <option value="MM">Multimedia</option>
                        </select>
                        <span class="error-msg" id="err-jurusan"></span>
                    </div>
                </div>

                <div class="field-group">
                    <label for="kegiatan">Nama Kegiatan</label>
                    <input type="text" id="kegiatan" name="kegiatan" placeholder="Contoh: Workshop Web Dev">
                    <span class="error-msg" id="err-kegiatan"></span>
                </div>

                <div class="field-group">
                    <label>Pilihan Konsumsi</label>
                    <div class="segmented-control">
                        <label class="segment-option">
                            <input type="radio" name="konsumsi" value="Reguler">
                            <span>Reguler</span>
                        </label>
                        <label class="segment-option">
                            <input type="radio" name="konsumsi" value="Vegetarian">
                            <span>Vegetarian</span>
                        </label>
                    </div>
                    <span class="error-msg" id="err-konsumsi"></span>
                </div>

                <div class="field-group" id="statusFieldGroup" style="display: none;">
                    <label for="statusPeserta">Status Peserta</label>
                    <select id="statusPeserta" name="statusPeserta">
                        <option value="Pending">Pending</option>
                        <option value="Approve">Approve</option>
                        <option value="Reject">Reject</option>
                    </select>
                </div>

                <div class="field-group checkbox-wrapper">
                    <label class="pixel-checkbox">
                        <input type="checkbox" id="persetujuan">
                        <span class="checkmark"></span>
                        <span class="label-text">Saya menyetujui syarat & ketentuan</span>
                    </label>
                    <span class="error-msg" id="err-persetujuan"></span>
                </div>

                <button type="submit" id="btnSubmit" class="pixel-btn" disabled>Daftar Sekarang</button>
            </form>
        </section>

        <!--hal2-->
        <section id="pageTable" class="pixel-card table-card halaman">
            <h2>Daftar Peserta Terdaftar</h2>
            <div class="table-wrapper">
                <table class="pixel-table">
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Email</th>
                            <th>Kelas & Jurusan</th>
                            <th>Kegiatan</th>
                            <th>Konsumsi</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelPesertaBody">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Bisfy. May This Journey Lead Us Starward!</p><br>
        <h6>Inspired By PixelOs UI</h6>
    </footer>

</body>
</html>
